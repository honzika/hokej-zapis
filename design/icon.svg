<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123049"/>
      <stop offset="1" stop-color="#07111B"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2D44"/>
      <stop offset="1" stop-color="#0B1621"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F8FB"/>
      <stop offset="1" stop-color="#B9C7D6"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- led: buly kruh a střední čára -->
  <circle cx="256" cy="330" r="150" fill="none" stroke="#4FC3F7" stroke-opacity=".18" stroke-width="8"/>
  <rect x="0" y="326" width="512" height="8" fill="#D32F2F" fill-opacity=".22"/>

  <!-- hokejky -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 232 L330 414 Q340 424 356 424 L404 424" fill="none" stroke="url(#shaft)" stroke-width="22"/>
    <path d="M362 232 L182 414 Q172 424 156 424 L108 424" fill="none" stroke="url(#shaft)" stroke-width="22"/>
    <!-- omotávky v barvách týmů -->
    <path d="M370 424 L404 424" stroke="#4FC3F7" stroke-width="22"/>
    <path d="M142 424 L108 424" stroke="#FF5A5A" stroke-width="22"/>
  </g>

  <!-- puk -->
  <ellipse cx="256" cy="452" rx="54" ry="20" fill="#05090E"/>
  <rect x="202" y="434" width="108" height="18" fill="#05090E"/>
  <ellipse cx="256" cy="434" rx="54" ry="20" fill="#1E2A36"/>
  <ellipse cx="256" cy="434" rx="54" ry="20" fill="none" stroke="#4FC3F7" stroke-opacity=".5" stroke-width="3"/>

  <!-- tabule se skóre -->
  <rect x="86" y="70" width="340" height="150" rx="28" fill="url(#board)" stroke="#4FC3F7" stroke-width="8"/>
  <g font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-weight="900" font-size="112" text-anchor="middle">
    <text x="176" y="186" fill="#FF5A5A">3</text>
    <text x="256" y="180" fill="#F5F8FB">:</text>
    <text x="336" y="186" fill="#4FC3F7">2</text>
  </g>
</svg>
