<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hokejový scoreboard</title>
<!-- Google Cast receiver SDK; mimo Chromecast se nenačte a stránka běží v demo režimu (?demo) -->
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  :root { --home: #d32f2f; --away: #1565c0; --bg: #0b1621; --panel: #16263a; --fg: #f5f8fb; --muted: #8da2b8; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  .board { height: 100vh; display: grid; grid-template-rows: 1fr auto auto; gap: 3vh; padding: 5vh 5vw; }
  .teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 3vw; }
  .team { background: var(--panel); border-radius: 3vh; overflow: hidden; text-align: center; height: 100%; display: flex; flex-direction: column; }
  .team .stripe { height: 2.2vh; }
  .team .name { font-size: 6vh; font-weight: 700; padding: 3vh 2vw 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .team .score { font-size: 30vh; font-weight: 900; line-height: 1; flex: 1; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
  .team .score.bump { animation: bump .9s ease-out; }
  @keyframes bump { 0% { transform: scale(1.35); color: #ffe082; } 100% { transform: scale(1); } }
  .colon { font-size: 16vh; font-weight: 800; color: var(--muted); }
  .clock { text-align: center; }
  .clock .time { font-size: 18vh; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .02em; line-height: 1; }
  .clock .time.running { color: #7cffa4; }
  .clock .period { font-size: 4.5vh; color: var(--muted); margin-top: 1vh; }
  .last { text-align: center; font-size: 4vh; color: var(--muted); min-height: 5vh; }
  .last b { color: var(--fg); }
  .team .head { display: flex; align-items: center; justify-content: center; gap: 1.5vw; padding: 3vh 2vw 0; }
  .team .head .name { padding: 0; }
  .team .logo { height: 9vh; width: 9vh; object-fit: contain; display: none; }
  .team .logo.show { display: block; }
  .waiting { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh; background: var(--bg); font-size: 5vh; color: var(--muted); }
  .waiting b { font-size: 8vh; color: var(--fg); }
  .waiting.hide { display: none; }
</style>
</head>
<body>
<div class="board">
  <div class="teams">
    <div class="team"><div class="stripe" style="background:var(--home)"></div><div class="head"><img class="logo" id="homeLogo" alt=""><div class="name" id="homeName">Domácí</div></div><div class="score" id="homeScore">0</div></div>
    <div class="colon">:</div>
    <div class="team"><div class="stripe" style="background:var(--away)"></div><div class="head"><div class="name" id="awayName">Hosté</div><img class="logo" id="awayLogo" alt=""></div><div class="score" id="awayScore">0</div></div>
  </div>
  <div class="clock"><div class="time" id="time">10:00</div><div class="period" id="period">1. třetina</div></div>
  <div class="last" id="last"></div>
</div>
<div class="waiting" id="waiting"><b>Hokejový zápis</b>Čekám na zápas z telefonu…</div>
<script>
  // Snapshot odpovídá ScoreboardSnapshot v composeApp (cz.hokej.zapis.cast).
  const NAMESPACE = 'urn:x-cast:cz.hokej.zapis';
  const $ = id => document.getElementById(id);
  let snap = null, receivedAt = 0;

  function fmt(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  function fmtUp(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  function setScore(el, value) {
    if (el.textContent !== String(value)) {
      el.textContent = value;
      el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
    }
  }

  function setLogo(img, src) {
    img.classList.toggle('show', !!src);
    if (src && img.getAttribute('src') !== src) img.src = src;
  }

  function render(s) {
    snap = s; receivedAt = performance.now();
    document.documentElement.style.setProperty('--home', s.home.color);
    document.documentElement.style.setProperty('--away', s.away.color);
    $('waiting').classList.add('hide');
    setLogo($('homeLogo'), s.home.logo);
    setLogo($('awayLogo'), s.away.logo);
    $('homeName').textContent = s.home.name;
    $('awayName').textContent = s.away.name;
    setScore($('homeScore'), s.home.score);
    setScore($('awayScore'), s.away.score);
    $('period').textContent =
      s.phase === 'FINISHED' ? 'Konec zápasu' :
      s.phase === 'PERIOD_END' ? `Konec ${s.period}. ${s.partGen || 'třetiny'}` :
      `${s.period}. ${s.part || 'třetina'} z ${s.periods}`;
    $('last').innerHTML = s.lastGoal ? 'Poslední gól: <b></b>' : '';
    if (s.lastGoal) $('last').querySelector('b').textContent = s.lastGoal;
  }

  // Hodiny se mezi zprávami dopočítávají lokálně, telefon nemusí posílat každou desetinu.
  function frame() {
    if (snap) {
      const ms = Math.max(0, snap.running ? snap.remainingMs - (performance.now() - receivedAt) : snap.remainingMs);
      // Fotbal: čas zápasu nahoru (2. poločas od 45:00), hokej: odpočet třetiny.
      $('time').textContent = snap.countUp
        ? fmtUp((snap.period - 1) * snap.periodLengthMs + snap.periodLengthMs - ms)
        : fmt(ms);
      $('time').classList.toggle('running', snap.running);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  const params = new URLSearchParams(location.search);
  if (window.cast && cast.framework && !params.has('demo')) {
    const ctx = cast.framework.CastReceiverContext.getInstance();
    ctx.addCustomMessageListener(NAMESPACE, e => render(typeof e.data === 'string' ? JSON.parse(e.data) : e.data));
    const options = new cast.framework.CastReceiverOptions();
    options.disableIdleTimeout = true;
    ctx.start(options);
  } else {
    // Demo: ?demo nebo ?state=<JSON snapshot>
    render(params.has('state') ? JSON.parse(params.get('state')) : {
      home: { name: 'HC Lvi', color: '#d32f2f', score: 3 },
      away: { name: 'Vlci Most', color: '#1565c0', score: 2 },
      period: 2, periods: 3, remainingMs: 431000, running: true, phase: 'RUNNING',
      lastGoal: 'HC Lvi · 17 Novák · 2. tř. 1:12'
    });
  }
</script>
</body>
</html>
